name: Weekly Lotto Data Sync

on:
  # 매주 토요일 오후 9시 KST (= UTC 12:00)에 자동 실행
  schedule:
    - cron: '0 12 * * 6'  # UTC 12:00 = KST 21:00 every Saturday
  # 수동 실행도 가능
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Collector & Sync to DB
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: node collector.js

      - name: Commit Updated lottoHistory.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/lottoHistory.json
          git diff --staged --quiet || git commit -m "Auto: Weekly lotto data sync [$(date +'%Y-%m-%d')]"
          git push
