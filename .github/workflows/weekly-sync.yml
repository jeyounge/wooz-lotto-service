name: Weekly Lotto Data Sync

on:
  # 매주 토요일 오후 9시 KST (= UTC 12:00)에 자동 실행
  schedule:
    - cron: '0 12 * * 6'
  workflow_dispatch:

# 봇이 lottoHistory.json 을 커밋/푸시하려면 쓰기 권한이 필요합니다.
permissions:
  contents: write

concurrency:
  group: weekly-lotto-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Collector with Retry (max 5 attempts, 30min interval)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          for attempt in 1 2 3 4 5; do
            echo "🎯 Attempt $attempt / 5"
            if node collector.js; then
              echo "✅ Success on attempt $attempt"
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "⏳ Latest round not published yet. Waiting 30 minutes..."
              sleep 1800
            fi
          done
          echo "❌ Latest round still missing after 5 attempts."
          exit 1

      # 최신 회차가 아직이더라도, 그 사이 채워진 과거 회차는 커밋합니다.
      - name: Commit Updated lottoHistory.json
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/lottoHistory.json
          git diff --staged --quiet || git commit -m "Auto: Weekly lotto data sync [$(date +'%Y-%m-%d')]"
          git push
